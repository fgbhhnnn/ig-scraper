name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller
      - name: Fetch + verify TikTok signer (cv-cat/TiktokApis @ b3b2a44)
        run: python tools/fetch_signer.py
      - name: Check bundled ffmpeg (imageio-ffmpeg Windows static build)
        run: python -c "import imageio_ffmpeg,os;p=imageio_ffmpeg.get_ffmpeg_exe();print(p,os.path.getsize(p))"
      - run: pyinstaller --noconfirm ig-scraper.spec
      - uses: actions/upload-artifact@v4
        with: { name: Social-Scraper-windows, path: dist/Social-Scraper.exe }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/Social-Scraper.exe }
